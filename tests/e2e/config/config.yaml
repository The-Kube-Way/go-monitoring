global:
  check_interval: 3s

http:
  - url: https://google.com
    expected_status_code: 200
  
  - url: https://httpstat.us/403  # Should fail
    expected_status_code: 200
  
  - url: https://httpstat.us/404
    expected_status_code: 404
    expected_response_body: "404 Not Found"

ping:
  - host: 127.0.0.1
  - host: 1.2.3.4

raw_tcp:
  - host: github.com
    port: 22
